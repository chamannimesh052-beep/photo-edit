<!DOCTYPE html>
<html>
<head>
<title>Chaman Edit Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Chaman Edit Pro 🔥</h1>
<input type="file" id="upload" accept="image/*">
<div class="box">
<img id="photo" src="">
</div>
<div class="btns">
<button onclick="filter1()">Black & White</button>
<button onclick="filter2()">Bright</button>
<button onclick="filter3()">Blur</button>
<button onclick="filter4()">Normal</button>
</div>
<script>
let photo=document.getElementById('photo');
upload.onchange=e=>photo.src=URL.createObjectURL(e.target.files[0]);
function filter1(){photo.style.filter='grayscale(100%)'}
function filter2(){photo.style.filter='brightness(150%)'}
function filter3(){photo.style.filter='blur(5px)'}
function filter4(){photo.style.filter='none'}
</script>
</<script src="script.js"></<script src="script.js"></script>
</body>
</html>

</html>
