<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaman Edit Pro - Video Editing Masterclass</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', sans-serif;}
body{background:#0a0a0a;color:white;}
.hero{
  background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1536240478700-b869070f9279?q=80&w=2000');
  background-size:cover;
  background-position:center;
  min-height:85vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}
.badge{
  background:#2D5BFF;
  color:white;
  padding:8px 20px;
  border-radius:50px;
  font-weight:800;
  font-size:18px;
  margin-bottom:15px;
}
.hero h1{
  font-size: clamp(45px, 10vw, 95px);
  font-weight:900;
}
.subtitle{margin-top:15px;font-size:18px;opacity:0.8;max-width:600px;}
.timeline-mock{
  margin-top:30px;
  width:95%;
  max-width:1000px;
  background:#1a1a1a;
  border-radius:12px;
  padding:12px;
  border:1px solid #333;
  display:flex;
  gap:8px;
  overflow:hidden;
}
.clip{height:40px;border-radius:6px;flex-shrink:0;}
.btns{display:flex;gap:15px;margin-top:30px;flex-wrap:wrap;justify-content:center;}
.btn{padding:14px 28px;border-radius:50px;font-weight:700;text-decoration:none;font-size:16px;cursor:pointer;border:none;}
.btn-primary{background:white;color:black;}
.btn-outline{background:transparent;border:2px solid white;color:white;}
.editor-section{background:#111;padding:50px 20px;text-align:center;}
.editor-box{max-width:600px;margin:30px auto;background:#1e1e1e;padding:25px;border-radius:20px;border:1px solid #333;}
.filter-btn{background:#2D5BFF;color:white;border:none;padding:10px 18px;margin:5px;border-radius:8px;font-weight:600;cursor:pointer;}
#preview{max-width:100%;margin-top:20px;border-radius:12px;display:none;}
</style>
</head>
<body>
<div class="hero">
  <div class="badge">Video Editing</div>
  <h1>Masterclass</h1>
  <p class="subtitle">Chaman Edit Pro - Seekho pro jaisa edit karna!</p>
  <div class="btns">
    <a class="btn btn-primary" href="#editor">🚀 Start Editing Now</a>
  </div>
</div>
<div class="editor-section" id="editor">
  <h2 style="font-size:32px;">Chaman Photo Editor 🔥</h2>
  <div class="editor-box">
    <input type="file" id="fileInput" accept="image/*">
    <div>
      <button class="filter-btn" onclick="apply('grayscale(100%)')">Black & White</button>
      <button class="filter-btn" onclick="apply('brightness(1.5)')">Bright</button>
      <button class="filter-btn" onclick="apply('blur(5px)')">Blur</button>
      <button class="filter-btn" onclick="apply('contrast(1.5) saturate(1.5)')">Masterclass Color</button>
      <button class="filter-btn" onclick="apply('none')" style="background:#333;">Normal</button>
    </div>
    <img id="preview">
    <br><a id="download" class="btn btn-primary" style="display:none;margin-top:15px;">Download</a>
  </div>
</div>
<script>
const input=document.getElementById('fileInput');
const preview=document.getElementById('preview');
const download=document.getElementById('download');
input.addEventListener('change',e=>{
  preview.src=URL.createObjectURL(e.target.files[0]);
  preview.style.display='block';
  download.style.display='inline-block';
});
function apply(f){preview.style.filter=f;}
download.addEventListener('click',()=>{
  const canvas=document.createElement('canvas');
  canvas.width=preview.naturalWidth;
  canvas.height=preview.naturalHeight;
  const ctx=canvas.getContext('2d');
  ctx.filter=preview.style.filter;
  ctx.drawImage(preview,0,0);
  download.href=canvas.toDataURL();
  download.download='chaman-masterclass-edit.jpg';
});
</script>
</body>
</html>
